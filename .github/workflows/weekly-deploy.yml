# Публикува статиите, чиято дата е дошла.
#
# `scripts/gen-blog.mjs` пуска в `src/data/blog-posts.json` само статиите с
# `date` <= днес. Този workflow го изпълнява всеки понеделник и ако файлът се е
# променил — значи има нова статия — комитва и бута. Push-ът вдига автоматичния
# деплой на Cloudflare Pages и статията излиза.
#
# Нарочно НЕ ползва deploy hook и никакви тайни: `GITHUB_TOKEN` е вграден в
# Actions, тоест нищо не се настройва на ръка. Ако няма нова статия, workflow-ът
# не прави комит и не вдига деплой.

name: Седмична публикация на блога

on:
  schedule:
    # 06:10 UTC всеки понеделник. Статиите носят дата неделя, тоест излизат
    # най-късно на следващата сутрин.
    - cron: '10 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Преизчислява кои статии са публикувани
        run: node scripts/gen-blog.mjs

      - name: Комитва, само ако е излязла нова статия
        run: |
          if git diff --quiet -- src/data/blog-posts.json; then
            echo "Няма статия с настъпила дата — нищо за публикуване."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-posts.json
          git commit -m "Излиза следващата статия по график"
          git push
